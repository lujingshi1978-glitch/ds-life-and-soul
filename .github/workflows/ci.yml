name: Source and boundary checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/feiyu/package-lock.json
      - name: Install locked core dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
        working-directory: packages/feiyu
      - name: Deployment and public package tests
        run: node --test tests/*.mjs
      - name: Core memory and transport tests
        run: npm test
        working-directory: packages/feiyu
      - name: Contextual growth, provenance and recall
        run: npm run test:memory-growth
        working-directory: packages/feiyu
      - name: Autonomous choices and self-action evidence
        run: npm run test:agency
        working-directory: packages/feiyu
      - name: Current UI contract
        run: node scripts/test-life-console.mjs
        working-directory: packages/feiyu
      - name: Public source gate
        run: node scripts/check-public-package.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Client test dependencies
        run: python -m pip install PySide6==6.12.0
      - name: Voice runtime installer fixtures
        run: node --test portable/voice-runtime/test-runtime.mjs
      - name: Python transport, cancellation and caption preferences
        run: python -m unittest discover -s tests -v
        working-directory: clients/feiyu-hotkey
      - name: Offscreen voice and subtitle chain
        run: python clients/feiyu-hotkey/tests/qt_voice_smoke.py --output .local/ci-voice
